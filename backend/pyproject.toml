[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vikas-backend"
version = "0.1.0"
description = "VIKAS — Viksit India Kaushal Alignment System backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34",
    # ORM + database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",              # Async PostgreSQL driver
    "alembic>=1.14",
    # Validation + settings
    "pydantic>=2.10",
    "pydantic-settings>=2.7",     # Loads config from .env files
    # Authentication
    "python-jose[cryptography]>=3.3",  # JWT encoding/decoding
    "passlib[bcrypt,argon2]>=1.7",     # Password hashing (argon2 primary, bcrypt legacy)
    "argon2-cffi>=23.1",               # Argon2 backend for passlib
    # HTTP client for external APIs (Adzuna, Jooble, Groq)
    "httpx>=0.28",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# NLP deps separated to avoid pulling PyTorch (~2GB) in CI lint/typecheck jobs
nlp = [
    "spacy>=3.8",
    "sentence-transformers>=3.4",
]
dev = [
    "ruff>=0.9",
    "black>=25",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pip-audit>=2.8",
    "httpx>=0.28",               # Also used as TestClient transport in tests
    "pre-commit>=4.1",
]

# Tell hatchling where the Python package lives — needed because
# the package name "app" doesn't match the project name "vikas-backend"
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88  # Matches black default

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify (simplifiable code)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Ignore missing stubs for third-party libs that don't ship type info
[[tool.mypy.overrides]]
module = [
    "jose.*",
    "passlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"  # All async test functions are automatically treated as async
testpaths = ["tests"]
markers = [
    "rls: tests that require PostgreSQL with RLS policies (skip without DB)",
]
