name: VIKAS Production CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-audit-and-test:
    name: Backend Lint, RBAC Audit & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vikas_test
          POSTGRES_USER: vikas
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & Format check (ruff)
        run: |
          ruff check app/ tests/ scripts/
          ruff format --check app/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy app/

      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://vikas:testpass@localhost:5432/vikas_test
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long

      - name: Automated RBAC Route Security Audit
        run: python scripts/audit_rbac_routes.py
        env:
          DATABASE_URL: postgresql+asyncpg://vikas:testpass@localhost:5432/vikas_test
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long

      - name: Tests with Coverage
        run: pytest --cov=app/services --cov=app/core/deps.py --cov-report=term-missing --cov-fail-under=40 tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://vikas:testpass@localhost:5432/vikas_test
          DATABASE_URL_TEST: postgresql+asyncpg://vikas:testpass@localhost:5432/vikas_test
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit --ignore-vuln PYSEC-2026-1325
        continue-on-error: true

  frontend-audit-and-build:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src/ --ext .ts,.tsx

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Tests (Vitest)
        run: npm run test:run

      - name: Production Build Check
        run: npm run build

  deploy-production:
    name: Deploy to Production (Vercel & Render/Railway)
    needs: [backend-audit-and-test, frontend-audit-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Backend Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering automated zero-downtime deploy to Render with Alembic migrations..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
